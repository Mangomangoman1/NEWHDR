  <section class="section sos-section" id="sos" aria-labelledby="sos-title">
    <div class="sos-bg" aria-hidden="true">

          <div class="sos-card-icon">
            <svg viewBox="0 0 48 48" fill="none" width="40" height="40">
              <path d="M24 6 C24 6 10 22 10 31 C10 38.7 16.3 45 24 45 C31.7 45 38 38.7 38 31 C38 22 24 6 24 6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path class="sos-water-drop-inner" d="M24 18 C24 18 16 28 16 33 C16 37 19.6 40 24 40 C28.4 40 32 37 32 33 C32 28 24 18 24 18Z" fill="currentColor" opacity="0.2"/>
            </svg>
          </div>
          <div class="sos-card-label">
            <strong>Water Damage</strong>
            <span>Phone in water? Act fast.</span>
          </div>
          <div class="sos-card-urgency sos-urgency--critical">
            <span class="sos-urgency-dot" aria-hidden="true"></span>
            Every minute counts
          </div>
          <div class="sos-card-arrow" aria-hidden="true">
            <span class="material-symbols-outlined">arrow_forward</span>
          </div>
        </button>

        <button class="sos-card" data-sos="cracked" role="listitem" aria-label="Cracked screen emergency guide">
          <div class="sos-card-pulse" aria-hidden="true"></div>
          <div class="sos-card-icon">
            <svg viewBox="0 0 48 48" fill="none" width="40" height="40">
              <rect x="10" y="6" width="28" height="36" rx="4" stroke="currentColor" stroke-width="2"/>
              <path class="sos-crack-line" d="M16 14 L22 22 L18 30 L26 36" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path class="sos-crack-line-2" d="M30 12 L34 18 L28 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <div class="sos-card-label">
            <strong>Cracked Screen</strong>
            <span>Glass shattered or flickering?</span>
          </div>
          <div class="sos-card-urgency sos-urgency--high">
            <span class="sos-urgency-dot" aria-hidden="true"></span>
            Fixable same day
          </div>
          <div class="sos-card-arrow" aria-hidden="true">
            <span class="material-symbols-outlined">arrow_forward</span>
          </div>
        </button>

        <button class="sos-card" data-sos="dead" role="listitem" aria-label="Dead battery emergency guide">
          <div class="sos-card-pulse" aria-hidden="true"></div>
          <div class="sos-card-icon">
            <svg viewBox="0 0 48 48" fill="none" width="40" height="40">
              <rect x="8" y="12" width="28" height="24" rx="3" stroke="currentColor" stroke-width="2"/>
              <path d="M36 20 L36 28 L40 28 L40 20 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <rect class="sos-battery-fill" x="10" y="14" width="8" height="20" rx="1" fill="currentColor" opacity="0.3"/>

            <strong>Dead / Won't Charge</strong>
            <span>Plugged in but nothing?</span>
          </div>
          <div class="sos-card-urgency sos-urgency--medium">
            <span class="sos-urgency-dot" aria-hidden="true"></span>
            Usually an easy fix
          </div>
          <div class="sos-card-arrow" aria-hidden="true">
            <span class="material-symbols-outlined">arrow_forward</span>
          </div>
        </button>

        <button class="sos-card" data-sos="overheat" role="listitem" aria-label="Overheating emergency guide">
          <div class="sos-card-pulse" aria-hidden="true"></div>
          <div class="sos-card-icon">

            <span class="material-symbols-outlined">arrow_forward</span>
          </div>
        </button>

        <button class="sos-card" data-sos="blackout" role="listitem" aria-label="Black screen emergency guide">

          </div>
          <div class="sos-card-label">

          <div class="sos-card-urgency sos-urgency--high">

          </div>
          <div class="sos-card-arrow" aria-hidden="true">
            <span class="material-symbols-outlined">arrow_forward</span>

        </button>

        <button class="sos-card" data-sos="data" role="listitem" aria-label="Data recovery emergency guide">

            </svg>
          </div>
          <div class="sos-card-label">
            <strong>Lost Photos / Data</strong>
            <span>Files gone or device not booting?</span>
          </div>
          <div class="sos-card-urgency sos-urgency--critical">
            <span class="sos-urgency-dot" aria-hidden="true"></span>
            Time matters here
          </div>
          <div class="sos-card-arrow" aria-hidden="true">
            <span class="material-symbols-outlined">arrow_forward</span>
          </div>
        </button>
