<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#4f8ef7" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(60)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(120)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(180)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(240)"/>
    <line x1="0" y1="0" x2="1200" y2="0" transform="translate(0,60)"/>
    <line x1="0" y1="0" x2="1200" y2="0" transform="translate(0,120)"/>
    <line x1="0" y1="0" x2="1200" y2="0" transform="translate(0,180)"/>
  </g>

  <!-- Glow blobs -->
  <circle cx="200" cy="500" r="250" fill="#4f8ef7" opacity="0.06"/>
  <circle cx="1000" cy="150" r="200" fill="#a371f7" opacity="0.05"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Phone icon (enlarged favicon style) -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="80" height="130" rx="12" fill="none" stroke="#4f8ef7" stroke-width="4"/>
    <rect x="24" y="110" width="32" height="6" rx="3" fill="#4f8ef7"/>
    <circle cx="40" cy="16" r="4" fill="#4f8ef7"/>
    <path d="M52 55 L68 70 L52 85" stroke="#3fb950" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="12" y1="70" x2="64" y2="70" stroke="#3fb950" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="200" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#e6edf3">Hailey Device</text>
  <text x="200" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#4f8ef7">Repair</text>

  <text x="200" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#8b949e">Don't replace it. Let me fix it.</text>

  <!-- Feature badges -->
  <g transform="translate(200, 420)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#4f8ef710" stroke="#4f8ef7" stroke-width="1"/>
    <text x="90" y="26" font-family="system-ui, sans-serif" font-size="15" fill="#4f8ef7" text-anchor="middle" font-weight="600">📱 Same-Day Repair</text>
  </g>
  <g transform="translate(200, 420)">
    <rect x="200" y="0" width="180" height="40" rx="20" fill="#3fb95010" stroke="#3fb950" stroke-width="1"/>
    <text x="290" y="26" font-family="system-ui, sans-serif" font-size="15" fill="#3fb950" text-anchor="middle" font-weight="600">🛡️ 90-Day Warranty</text>
  </g>
  <g transform="translate(200, 420)">
    <rect x="400" y="0" width="180" height="40" rx="20" fill="#a371f710" stroke="#a371f7" stroke-width="1"/>
    <text x="490" y="26" font-family="system-ui, sans-serif" font-size="15" fill="#a371f7" text-anchor="middle" font-weight="600">🔍 Free Diagnostic</text>
  </g>

  <!-- Location -->
  <text x="200" y="530" font-family="system-ui, sans-serif" font-size="20" fill="#484f58">📍 Hailey, Idaho · Wood River Valley · Curbside &amp; Mail-In</text>

  <!-- URL -->
  <text x="200" y="580" font-family="system-ui, sans-serif" font-size="18" fill="#4f8ef7" font-weight="600">haileyrepair.com</text>

  <!-- Bottom accent -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>
